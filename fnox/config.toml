# https://fnox.jdx.dev/schema.json
#
# Add encrypted secrets with: fnox set <name> --provider age --global

[providers.onepassword]
type = "1password"
vault = "Workbench"
account = "my.1password.com"

[providers.age]
type = "age"
recipients = ["ssh-rsa "]
identity = { provider = "onepassword", value = "op://Workbench/FNOX/private key?ssh-format=openssh" }

[secrets]
DATABASE_URL = { provider = "age", value = "" }
